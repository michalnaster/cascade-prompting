[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cascade-prompting"
version = "0.1.0"
description = "Benchmark comparing baseline / multi-call / cascade prompting structures for grounded, fact-checked RAG answers"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Michal Nasternak" }]

dependencies = [
    "langchain>=0.3",
    "langchain-ollama>=0.2",
    "langchain-anthropic>=0.3",
    "langchain-huggingface>=0.1",
    "pydantic>=2",
    "datasets>=2.19",
    "pandas>=2",
    "scipy>=1.10",
    "ragas==0.3.9",
    "sentence-transformers>=3.0",
    "tqdm>=4.66",
    "matplotlib>=3.10.9",
]

[project.optional-dependencies]
observability = [
    "opik>=2.2",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.10",
]
notebook = [
    "jupyter>=1.0",
    "ipykernel>=6.29",
    "matplotlib>=3.9",
]

[project.scripts]
cascade-benchmark = "cascade_prompting.cli:main"

[tool.setuptools.packages.find]
include = ["cascade_prompting*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
# No pinned python_version: let mypy infer it from the interpreter running
# it. Pinning to our 3.10 floor makes mypy parse third-party stubs (e.g.
# numpy's, which use 3.12+ syntax) against an older grammar and fail outright.
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
